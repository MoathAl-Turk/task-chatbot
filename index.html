<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Task Manager & Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Authentication Screen -->
    <div id="auth-container" class="auth-screen">
        <div class="auth-card">
            <h2>Task-Chatbot Login</h2>
            <p>Sign in to manage your tasks securely.</p>
            
            <div id="auth-error" class="error-message"></div>

            <form id="email-auth-form">
                <input type="email" id="auth-email" placeholder="Email address" required>
                <input type="password" id="auth-password" placeholder="Password" required>
                <button type="submit" id="email-submit-btn" class="primary-btn">Sign In / Register</button>
            </form>

            <div class="divider"><span>or</span></div>

            <button id="google-auth-btn" class="google-btn">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.46 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.12-.28-1.71s.1-1.17.28-1.71V4.96H.96C.35 6.18 0 7.55 0 9s.35 2.82.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.46 2.02.96 4.96l3.01 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
                Sign in with Google
            </button>
        </div>
    </div>

    <!-- Main Application Dashboard -->
    <div id="app-container" class="app-layout hidden">
        <header class="app-header">
            <h1>Task-Chatbot Dashboard</h1>
            <div class="user-info">
                <span id="user-display-email"></span>
                <button id="logout-btn" class="secondary-btn">Sign Out</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Task Manager Section -->
            <section class="task-section">
                <h2>My Tasks</h2>
                <form id="task-form">
                    <input type="text" id="task-input" placeholder="Add a new task..." required>
                    <button type="submit" class="primary-btn">Add Task</button>
                </form>
                <ul id="task-list"></ul>
            </section>

            <!-- AI Chatbot Section -->
            <section class="chat-section">
                <h2>AI Assistant</h2>
                <div id="chat-messages" class="chat-messages"></div>
                <form id="chat-form">
                    <input type="text" id="chat-input" placeholder="Ask your AI assistant..." required>
                    <button type="submit" class="primary-btn">Send</button>
                </form>
            </section>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module" src="script.js"></script>
</body>
</html>
